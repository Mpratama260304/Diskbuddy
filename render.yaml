services:
  - type: web
    name: diskbuddy-mirror
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_URL
        sync: false
      - key: UPSTREAM_URL
        value: https://www.diskbuddy.com
      - key: UPSTREAM_ALIASES
        value: https://diskbuddy.com
      - key: INDEXABLE
        value: "false"
      - key: CANONICAL_MODE
        value: mirror
      - key: TRUST_PROXY
        value: "true"